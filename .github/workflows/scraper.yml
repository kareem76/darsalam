name: asserBS

on:
  push:
    branches:
      - asser
  pull_request:
    branches:
      - asser

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        range:
          - { start: 3001, end: 3100 }
          - { start: 3101, end: 3200 }
          - { start: 3201, end: 3300 }
          - { start: 3301, end: 3400 }
          - { start: 3401, end: 3500 }
          - { start: 3501, end: 3605 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install playwright cheerio

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run scraper with xvfb
        env:
          START_PAGE: ${{ matrix.range.start }}
          END_PAGE: ${{ matrix.range.end }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum -- node asser.js

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: books-${{ matrix.range.start }}-${{ matrix.range.end }}
          path: books_${{ matrix.range.start }}_${{ matrix.range.end }}.ndjson
