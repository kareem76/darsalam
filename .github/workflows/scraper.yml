name: Parallel Scraper

on:
  push:
    branches:
      - assir
  pull_request:
    branches:
      - assir

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        range:
          - "1 60"
          - "61 120"
          - "121 180"
          - "181 240"
          - "241 300"
          - "301 360"
          - "361 420"
          - "421 480"
          - "481 540"
          - "541 600"
          - "601 660"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-driver
          bundle install

      - name: Run scraper
        env:
          START_PAGE: ${{ matrix.range.split(' ')[0] }}
          END_PAGE: ${{ matrix.range.split(' ')[1] }}
        run: ruby shourouk_split.rb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: books-${{ matrix.range }}
          path: |
            books_${{ matrix.range }}.csv
            books_${{ matrix.range }}.json
