name: Parallel Scraper

on:
  push:
    branches:
      - assir
  pull_request:
    branches:
      - assir

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        range:
          - { start: 1, end: 150 }
          - { start: 151, end: 300 }
          - { start: 301, end: 450 }
          - { start: 451, end: 663 }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-driver
          bundle install

      - name: Run scraper
        env:
          START_PAGE: ${{ matrix.range.start }}
          END_PAGE: ${{ matrix.range.end }}
          CATEGORY_PATH: "/books/arabic"   # You can override this if needed
        run: ruby shourouk_split.rb
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: books-${{ matrix.range.start }}-${{ matrix.range.end }}
          path: |
            books_${{ matrix.range.start }}_${{ matrix.range.end }}.csv
            books_${{ matrix.range.start }}_${{ matrix.range.end }}.json
