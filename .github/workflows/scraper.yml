name: Full Scraper

on:
  push:
    branches:
      - assir
  pull_request:
    branches:
      - assir

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-driver
          bundle install

      - name: Run scraper
        env:
          START_PAGE: 1
          END_PAGE: 663
          CATEGORY_PATH: "/books/arabic"
        run: ruby shourouk_split.rb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: books-1-663
          path: |
            books_1_663.csv
            books_1_663.json
