name: Parallel Scraper

on:
  push:
    branches:
      - assir
  pull_request:
    branches:
      - assir

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        range:
          - { start: 1, end: 60 }
          - { start: 61, end: 120 }
          - { start: 121, end: 180 }
          - { start: 181, end: 240 }
          - { start: 241, end: 300 }
          - { start: 301, end: 360 }
          - { start: 361, end: 420 }
          - { start: 421, end: 480 }
          - { start: 481, end: 540 }
          - { start: 541, end: 600 }
          - { start: 601, end: 660 }

    steps:
      - uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-driver
          bundle install

      - name: Run scraper
        env:
          START_PAGE: ${{ matrix.range.start }}
          END_PAGE: ${{ matrix.range.end }}
        run: ruby salam.rb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: books-${{ matrix.range.start }}-${{ matrix.range.end }}
          path: |
            books_${{ matrix.range.start }}_${{ matrix.range.end }}.csv
            books_${{ matrix.range.start }}_${{ matrix.range.end }}.json
